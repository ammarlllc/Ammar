<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1124" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <radialGradient id="redOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="70%" stop-color="#ff0044" />
      <stop offset="100%" stop-color="#80001a" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00ff88" stroke-width="4" stroke-opacity="0.35" />

  <!-- Grid Tech Lines -->
  <path d="M 60 120 L 452 120 M 60 256 L 452 256 M 60 392 L 452 392 M 120 60 L 120 452 M 256 60 L 256 452 M 392 60 L 392 452" stroke="#00ff88" stroke-opacity="0.08" stroke-width="2" />

  <!-- Cyber Shield / Hexagon -->
  <polygon points="256,70 410,150 410,340 256,430 102,340 102,150" fill="#040b17" stroke="url(#cyberGreen)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Cyber Snake Path -->
  <path d="M 160,200 H 320 V 270 H 200 V 340 H 350" fill="none" stroke="#00ff88" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- Snake Head -->
  <rect x="338" y="326" width="28" height="28" rx="6" fill="#00ff88" />
  <circle cx="355" cy="336" r="4" fill="#050811" />

  <!-- 5 Red Data Orbs (The 5 Secret Keys) -->
  <circle cx="160" cy="200" r="14" fill="url(#redOrb)" filter="url(#neonGlow)" />
  <circle cx="320" cy="200" r="14" fill="url(#redOrb)" filter="url(#neonGlow)" />
  <circle cx="200" cy="270" r="14" fill="url(#redOrb)" filter="url(#neonGlow)" />
  <circle cx="320" cy="270" r="14" fill="url(#redOrb)" filter="url(#neonGlow)" />
  <circle cx="200" cy="340" r="14" fill="url(#redOrb)" filter="url(#neonGlow)" />

  <!-- Center Text / Badge -->
  <text x="256" y="475" text-anchor="middle" font-family="monospace, sans-serif" font-weight="900" font-size="28" fill="#00ff88" letter-spacing="4">AMMAR H4CKER</text>
</svg>
